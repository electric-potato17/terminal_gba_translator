[package]
name = "terminal_gba_translator"
version = "0.1.0"
edition = "2021"
description = "A terminal frontend for Game Boy Advance games"
license = "MIT"
default-run = "termgba"

[features]
default = ["mgba", "native-audio"]
mgba = ["dep:mgba"]
native-audio = ["dep:cpal"]
mock-audio = []

[dependencies]
base64 = "0.23.1"
cpal = { version = "0.15", optional = true }
crossterm = "0.29"
flate2 = "1.1.10"
thiserror = "1.0"
mgba = { version = "0.1.0", optional = true }

[dev-dependencies]
# For integration tests with pty (optional, later)
# async-process = "1.0"
# tokio = { version = "1", features = ["process", "macros", "rt-multi-thread"] }

[[bin]]
name = "termgba"
path = "src/main.rs"
required-features = ["mgba"]

[[example]]
name = "test_input"
path = "examples/test_input.rs"

[[example]]
name = "test_audio"
path = "examples/test_audio.rs"
required-features = ["native-audio"]
