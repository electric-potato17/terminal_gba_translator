[package]
name = "terminal_gba_translator"
version = "0.1.0"
edition = "2021"

[features]
mock-audio = []

[dependencies]
crossterm = "0.27"
cpal = { version = "0.15", default-features = false, features = ["jack"] }
thiserror = "1.0"

[dev-dependencies]
